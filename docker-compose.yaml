services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      - login-service
      - statement-service
      - user-service

  dex:
    image: dexidp/dex:latest-alpine
    command: [ "dex", "serve", "/etc/dex/config.yaml" ]
    environment:
      DEX_CLIENT_SECRET: ${DEX_CLIENT_SECRET:-local-secret}
    volumes:
      - ./config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"

  login-service:
    build:
      context: .
      dockerfile: login-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DEX_CLIENT_SECRET: ${DEX_CLIENT_SECRET:-local-secret}
    depends_on:
      dex:
        condition: service_started

  statement-service:
    build:
      context: .
      dockerfile: statement-service/Dockerfile
    depends_on:
      statements-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ministack:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      REGION: ${REGION:-af-south-1}
      BUCKET_NAME: ${BUCKET_NAME:-customer-statements-bucket}
      USER_SERVICE_URI: http://user-service:8083

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local

  user-db:
    image: postgres:18
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d users" ]
      interval: 5s
      timeout: 5s
      retries: 5

  statements-db:
    image: postgres:18
    environment:
      POSTGRES_DB: customer_statements
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d customer_statements" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  ministack:
    image: ministackorg/ministack:1.4.0
    environment:
      MINISTACK_REGION: ${REGION:-af-south-1}
      S3_PERSIST: 1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ministack-init:
    image: amazon/aws-cli:2.31.10
    depends_on:
      ministack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${SECRET_KEY:-test}
      AWS_DEFAULT_REGION: ${REGION:-af-south-1}
      AWS_ENDPOINT_URL: http://ministack:4566
      BUCKET_NAME: ${BUCKET_NAME:-customer-statements-bucket}
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >
        aws configure set default.s3.addressing_style path;
        aws s3 mb s3://$${BUCKET_NAME} || true;
        aws s3 ls