spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cloud:
    aws:
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
      region:
        static: af-south-1
  data:
    redis:
      host: localhost
      port: 6379
app:
  s3:
    bucket-name: test-bucket
    presign-url-expiration-seconds: 300
  redis:
    presign-url-ttl-seconds: 270
  pagination:
    max-page-size: 25
    min-page-size: 1
    min-page-number: 0
services:
  user-service:
    uri: http://localhost:8083
    connect-timeout: 2s
    read-timeout: 3s